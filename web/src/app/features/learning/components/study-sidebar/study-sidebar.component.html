<div class="flex h-full min-h-0">
  <!-- Vertical rail -->
  <nav class="flex w-12 shrink-0 flex-col items-center gap-1 border-r border-[#1D293D] bg-[#151823] py-3" aria-label="Điều hướng không gian học">
    <button
      type="button"
      (click)="toggle.emit()"
      class="grid h-9 w-9 place-items-center rounded-lg text-white/80 transition hover:bg-white/10 hover:text-white"
      [attr.aria-label]="open ? 'Ẩn nội dung khóa học' : 'Hiện nội dung khóa học'"
    >
      @if (open) {
        <svg lucidePanelLeftClose class="h-5 w-5" aria-hidden="true"></svg>
      } @else {
        <svg lucidePanelLeftOpen class="h-5 w-5" aria-hidden="true"></svg>
      }
    </button>

    <span class="my-2 h-px w-6 bg-white/10"></span>

    <button
      type="button"
      (click)="toggle.emit()"
      class="grid h-9 w-9 place-items-center rounded-lg bg-[#0072F8] text-white transition hover:bg-[#1a82ff]"
      aria-label="Mục lục khóa học"
    >
      <svg lucideBookOpen class="h-[18px] w-[18px]" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      (click)="utilityRequested.emit('resources')"
      class="grid h-9 w-9 place-items-center rounded-lg text-white/55 transition hover:bg-white/10 hover:text-white"
      aria-label="Tài liệu bài học"
    >
      <svg lucideNotebookText class="h-[18px] w-[18px]" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      (click)="requestLab()"
      class="grid h-9 w-9 place-items-center rounded-lg text-white/55 transition hover:bg-white/10 hover:text-white"
      aria-label="Phòng lab"
    >
      <svg lucideFlaskConical class="h-[18px] w-[18px]" aria-hidden="true"></svg>
    </button>
    <button
      type="button"
      (click)="utilityRequested.emit('qa')"
      class="grid h-9 w-9 place-items-center rounded-lg text-white/55 transition hover:bg-white/10 hover:text-white"
      aria-label="Hỏi đáp với giảng viên"
    >
      <svg lucideCircleQuestionMark class="h-[18px] w-[18px]" aria-hidden="true"></svg>
    </button>
  </nav>

  <!-- Course sidebar -->
  @if (open) {
    <aside class="flex w-[320px] shrink-0 flex-col overflow-y-auto bg-[#061543] 2xl:w-[368px]" aria-label="Nội dung khóa học">
      <div class="p-4">
        <div class="rounded-2xl bg-gradient-to-br from-[#0072F8] to-[#2351DE] p-4 shadow-[0_10px_15px_-3px_rgba(0,0,0,0.1)]">
          <div class="flex items-start gap-3">
            <span class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-white/15 text-white">
              <svg lucideBookOpen class="h-6 w-6" aria-hidden="true"></svg>
            </span>
            <div class="min-w-0">
              <h2 class="text-[14px] font-bold leading-5 text-white">{{ course.title }}</h2>
              <p class="mt-0.5 truncate text-[12px] leading-4 text-white/70">Bởi {{ course.instructor }}</p>
            </div>
          </div>
          <div class="mt-3 flex items-center justify-between text-[13px] text-white/80">
            <span>Tiến độ khóa học</span>
            <strong class="text-[12px] font-bold text-white">{{ progress }}%</strong>
          </div>
          <div class="mt-1.5 h-1.5 overflow-hidden rounded-full bg-white/20">
            <div class="h-full rounded-full bg-white transition-all duration-500" [style.width.%]="progress"></div>
          </div>
        </div>
      </div>

      <p class="px-5 pb-2 pt-2 text-[12px] font-bold uppercase tracking-[0.0833em] text-white/50">Nội dung khóa học</p>

      <nav class="pb-6">
        @for (chapter of course.chapters; track chapter.id) {
          <section class="border-t border-white/5">
            <button
              type="button"
              (click)="chapterToggled.emit(chapter.id)"
              class="flex min-h-11 w-full items-center justify-between gap-3 px-5 py-3 text-left text-[14px] font-bold leading-5 text-white transition hover:bg-white/5"
              [attr.aria-expanded]="isOpen(chapter)"
            >
              <span class="min-w-0">{{ chapter.title }}</span>
              <svg
                lucideChevronDown
                class="h-4 w-4 shrink-0 text-white/70 transition-transform"
                [class.rotate-180]="isOpen(chapter)"
                aria-hidden="true"
              ></svg>
            </button>

            @if (isOpen(chapter)) {
              <div class="pb-2">
                @for (lesson of chapter.lessons; track lesson.id) {
                  <button
                    type="button"
                    (click)="lessonSelected.emit(lesson)"
                    class="flex w-full items-center gap-3 border-l-2 px-5 py-2.5 text-left transition"
                    [class]="
                      lesson.id === activeLessonId
                        ? 'border-[#0072F8] bg-[#0072F8]/15'
                        : 'border-transparent hover:bg-white/5'
                    "
                    [attr.aria-current]="lesson.id === activeLessonId ? 'step' : null"
                  >
                    <span class="grid h-4 w-4 shrink-0 place-items-center">
                      @switch (lessonStatus(lesson)) {
                        @case ('done') {
                          <svg lucideCheck class="h-4 w-4 text-[#22C55E]" aria-hidden="true"></svg>
                        }
                        @case ('failed') {
                          <svg lucideCircleAlert class="h-4 w-4 text-[#F59E0B]" aria-hidden="true"></svg>
                        }
                        @default {
                          <svg lucideCircle class="h-4 w-4 text-white/30" aria-hidden="true"></svg>
                        }
                      }
                    </span>

                    <span class="shrink-0 text-white/60">
                      @switch (lesson.type) {
                        @case ('video') {
                          <svg lucideCirclePlay class="h-4 w-4" aria-hidden="true"></svg>
                        }
                        @case ('reading') {
                          <svg lucideFileText class="h-4 w-4" aria-hidden="true"></svg>
                        }
                        @case ('quiz') {
                          <svg lucideCircleQuestionMark class="h-4 w-4" aria-hidden="true"></svg>
                        }
                        @default {
                          <svg lucideCode2 class="h-4 w-4" aria-hidden="true"></svg>
                        }
                      }
                    </span>

                    <span class="min-w-0 flex-1 truncate text-[14px] leading-5 text-white/80">{{ lesson.title }}</span>
                    <span class="shrink-0 text-[12px] leading-4 text-white/45">{{ lesson.duration }}</span>
                  </button>
                }
              </div>
            }
          </section>
        }
      </nav>
    </aside>
  }
</div>
