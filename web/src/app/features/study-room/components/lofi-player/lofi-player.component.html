<div class="backdrop" (click)="close.emit()"></div>
<section class="player">
  <header><div><strong>STUDY AMBIENCE</strong><small>{{ subtitle() }}</small></div><span class="playing-dot" [class.on]="playing()"></span></header>
  <div class="collections">
    <button type="button" [class.active]="collection() === 'lofi'" (click)="collection.set('lofi')">Lofi</button>
    <button type="button" [class.active]="collection() === 'instrumental'" (click)="collection.set('instrumental')">Instrumental</button>
    <button type="button" [class.active]="collection() === 'nature'" (click)="collection.set('nature')">Nature</button>
    <button type="button" [class.active]="collection() === 'noise'" (click)="collection.set('noise')">White Noise</button>
  </div>
  <div class="controls"><button class="play" type="button" (click)="toggle()" [attr.aria-label]="playing() ? 'Tạm dừng nhạc' : 'Phát nhạc'">@if (playing()) { <svg lucidePause></svg> } @else { <svg lucidePlay></svg> }</button><button class="shuffle" type="button" (click)="shuffle()" aria-label="Trộn track"><svg lucideShuffle></svg></button><div class="volume"><div><svg lucideVolume2></svg><span>{{ volume() * 100 | number:'1.0-0' }}%</span></div><input type="range" min="0" max="1" step="0.05" [value]="volume()" (input)="setVolume($event)" aria-label="Âm lượng nhạc nền" /></div></div>
  <div class="tracks">@for (track of visibleTracks(); track track.src) { <div class="track" [class.selected]="selected() === track.index || selectedAmbient() === track.index"><button type="button" (click)="choose(track.index)">{{ track.name }}</button><button class="favorite" type="button" (click)="toggleFavorite(track.index)" [attr.aria-label]="favorites().has(track.index) ? 'Bỏ yêu thích' : 'Yêu thích'"><svg lucideHeart [class.filled]="favorites().has(track.index)"></svg></button></div> }</div>
  <div class="ambient"><div><strong>AMBIENT MIX</strong><span>{{ ambientMix() * 100 | number:'1.0-0' }}%</span></div><input type="range" min="0" max="1" step="0.05" [value]="ambientMix()" (input)="setAmbientMix($event)" aria-label="Tỷ lệ mix âm thanh môi trường" /></div>
  <audio #audio [src]="tracks[selected()].src" loop></audio><audio #ambientAudio [src]="tracks[selectedAmbient()].src" loop></audio>
</section>
