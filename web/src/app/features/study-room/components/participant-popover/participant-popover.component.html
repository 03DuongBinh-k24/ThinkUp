<aside (pointerdown)="$event.stopPropagation()" (click)="$event.stopPropagation()">
  <button class="close" type="button" (click)="close.emit()" aria-label="Đóng thông tin thành viên"><svg lucideX></svg></button>
  <div class="identity">
    <span [style.background]="color()">@if (participant().avatar && !avatarFailed()) { <img [src]="participant().avatar" [alt]="participant().displayName || participant().name" (error)="avatarFailed.set(true)" /> } @else { {{ participant().initials }} }</span>
    <div><strong>{{ participant().displayName || participant().name }}</strong><small>{{ participant().roleLabel }}</small></div>
  </div>
  <div class="actions">
    <button class="report" type="button" (click)="report.emit()"><svg lucideFlag></svg> Báo cáo</button>
    @if (canRemove()) { <button class="remove" type="button" (click)="remove.emit()"><svg lucideLogOut></svg> Mời ra khỏi phòng</button> }
  </div>
</aside>
