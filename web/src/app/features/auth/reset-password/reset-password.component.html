<div class="min-h-screen bg-[#F8F9FF] flex flex-col font-['Inter']">
  <main class="flex flex-1 relative overflow-hidden items-center justify-center py-[clamp(1.5rem,4vh,3rem)] px-4 sm:px-6 lg:px-8">
    <div class="absolute top-[-10%] left-[-5%] w-[clamp(200px,30vw,400px)] h-[clamp(200px,30vw,400px)] rounded-full bg-[#006AB5]/5 blur-[120px] pointer-events-none" aria-hidden="true"></div>
    <div class="absolute bottom-[-10%] right-[-5%] w-[clamp(200px,30vw,400px)] h-[clamp(200px,30vw,400px)] rounded-full bg-[#924700]/5 blur-[120px] pointer-events-none" aria-hidden="true"></div>

    <section class="w-full max-w-[min(448px,calc(100vw-2rem))] bg-white border border-[#E2E8F0] rounded-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.1)] p-[clamp(1.25rem,4vw,3rem)] flex flex-col items-center relative z-10">
      <header class="text-center mb-[clamp(1rem,3vh,2rem)] mt-[clamp(4px,0.5vh,8px)]">
        <h1 class="text-[#191B23] text-[clamp(20px,2.5vw,24px)] font-semibold leading-[1.3] tracking-[-0.01em] mb-[clamp(4px,0.5vh,8px)]">
          Thay đổi mật khẩu
        </h1>
        <p class="text-[#424754] text-[clamp(13px,1.2vw,14px)] leading-[1.5] font-normal">
          Vui lòng sử dụng mật khẩu mạnh (phải có ít nhất 8 ký tự)
        </p>
      </header>

      @if (errors().api) {
        <div role="alert" class="w-full mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-[clamp(12px,1vw,13px)] text-center font-medium">
          {{ errors().api }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-[clamp(1rem,2.5vh,1.5rem)]" novalidate>
        <!-- Password -->
        <div class="flex flex-col gap-[clamp(4px,0.5vh,8px)]">
          <label for="reset-password" class="block text-[clamp(13px,1.1vw,14px)] font-semibold text-[#191B23] leading-[1.2] tracking-[0.01em]">Mật khẩu mới</label>
          <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'" id="reset-password"
              [value]="password()" (input)="onPasswordChange($any($event.target).value)"
              placeholder="••••••••" autocomplete="new-password" minlength="8"
              class="w-full h-[clamp(44px,5vh,53px)] px-4 pr-12 py-2 border rounded-lg bg-white text-[#191B23] placeholder-[#6D717F] focus:outline-none focus:ring-2 focus:ring-[#006AB5]/50 focus:border-[#006AB5] font-medium text-[clamp(13px,1.1vw,14px)] leading-[1.4] transition-all duration-200"
              [class.border-red-500]="errors().password" [class.border-[#C2C6D6]]="!errors().password" />
            <button type="button" (click)="toggleShowPassword()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-[#727785] hover:text-[#191B23] transition-colors p-1">
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
          @if (errors().password) {
            <span class="text-red-500 text-[clamp(11px,0.9vw,12px)] mt-0.5" role="alert">{{ errors().password }}</span>
          }
        </div>

        <!-- Confirm Password -->
        <div class="flex flex-col gap-[clamp(4px,0.5vh,8px)]">
          <label for="reset-confirm-password" class="block text-[clamp(13px,1.1vw,14px)] font-semibold text-[#191B23] leading-[1.2] tracking-[0.01em]">Xác nhận mật khẩu</label>
          <div class="relative">
            <input [type]="showConfirmPassword() ? 'text' : 'password'" id="reset-confirm-password"
              [value]="confirmPassword()" (input)="onConfirmChange($any($event.target).value)"
              placeholder="••••••••" autocomplete="new-password" minlength="8"
              class="w-full h-[clamp(44px,5vh,53px)] px-4 pr-12 py-2 border rounded-lg bg-white text-[#191B23] placeholder-[#6D717F] focus:outline-none focus:ring-2 focus:ring-[#006AB5]/50 focus:border-[#006AB5] font-medium text-[clamp(13px,1.1vw,14px)] leading-[1.4] transition-all duration-200"
              [class.border-red-500]="errors().confirmPassword" [class.border-[#C2C6D6]]="!errors().confirmPassword" />
            <button type="button" (click)="toggleShowConfirm()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-[#727785] hover:text-[#191B23] transition-colors p-1">
              @if (showConfirmPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
          @if (errors().confirmPassword) {
            <span class="text-red-500 text-[clamp(11px,0.9vw,12px)] mt-0.5" role="alert">{{ errors().confirmPassword }}</span>
          }
        </div>

        <div class="mt-[clamp(4px,0.5vh,8px)]">
          <button type="submit" [disabled]="loading()"
            class="w-full h-[clamp(44px,5vh,48px)] bg-[#0058BE] hover:bg-[#004a9e] active:scale-[0.98] disabled:bg-[#cccccc] disabled:cursor-not-allowed text-white font-semibold text-[clamp(13px,1.1vw,14px)] leading-[1.2] tracking-[0.01em] rounded-lg transition-all duration-200 shadow-[0px_1px_2px_0px_rgba(0,0,0,0.05)] flex items-center justify-center">
            {{ loading() ? 'Đang xử lý...' : 'Cập nhật mật khẩu' }}
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
