<div class="upload-box flex rounded-lg border border-dashed bg-[#F8FAFD] min-h-[201px] flex-col justify-center p-4 items-center" [class.dragging]="dragging()" [class.invalid]="error()" (dragenter)="$event.preventDefault();dragging.set(true)" (dragover)="$event.preventDefault()" (dragleave)="dragging.set(false)" (drop)="drop($event)">
  @if (preview()) {<div class="mb-3 relative h-16 w-20 overflow-hidden rounded-lg border border-[#E0E5EB] bg-white"><img [src]="preview()" alt="Ảnh đại diện bài viết" class="h-full w-full object-cover"><button type="button" (click)="value.set(null)" class="absolute right-1 top-1 rounded-full bg-black/60 p-0.5 text-white" aria-label="Xóa ảnh"><app-blog-icon name="x" [size]="12" /></button></div>} @else {<div class="mb-2 flex h-10 w-10 items-center justify-center rounded-lg bg-[#F1F5F9] text-[#677283]"><app-blog-icon name="image-plus" [size]="20" /></div>}
  <span class="mb-2 text-center text-sm text-[#677283]">Kéo thả ảnh vào đây</span><span class="-mt-1 text-xs text-[#677283]">hoặc</span><button type="button" (click)="fileInput.click()" class="mt-1 h-8 border border-[#1E4AD7]/30 bg-[#1E4AD7]/5 text-[#1E4AD7] inline-flex items-center justify-center gap-2 rounded-lg px-4 text-sm font-medium">Chọn ảnh</button><input #fileInput type="file" accept="image/*" (change)="choose($event)" class="sr-only" aria-label="Chọn ảnh đại diện">
</div><p class="mt-2 text-xs leading-4 text-[#63738C]">Kích thước đề xuất: 1200x630px (tối đa {{ maxSizeMb() }}MB)</p>@if (fileError() || error()) {<p role="alert" class="mt-2 text-[13px] font-medium text-[#DB2929]">▲ {{ fileError() || error() }}</p>}
