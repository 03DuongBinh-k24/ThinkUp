<div class="flex min-h-10 flex-wrap items-center gap-1.5 rounded-lg border border-[#E0E5EB] bg-[#F8FAFD] px-2.5 py-1.5 focus-within:border-[#1E4AD7] focus-within:ring-2 focus-within:ring-[#1E4AD7]/15">@for (item of value(); track item) {<span class="inline-flex h-6 items-center gap-1 rounded-md bg-[#EAF0FF] px-2 text-xs font-medium text-[#1E4AD7]">{{ item }}<button type="button" (click)="remove(item)" [attr.aria-label]="'Xóa ' + item" class="rounded-sm hover:bg-[#D9E4FF]"><app-blog-icon name="x" [size]="12" /></button></span>}<input [(ngModel)]="draft" [attr.aria-label]="label()" (keydown)="keydown($event)" (blur)="commit()" [placeholder]="value().length ? '' : placeholder()" class="h-7 min-w-[150px] flex-1 bg-transparent text-sm text-[#0B1628] outline-none placeholder:text-[#677283]"></div>@if (hint()) {<p class="mt-2 text-xs leading-4 text-[#677283]">{{ hint() }}</p>}
